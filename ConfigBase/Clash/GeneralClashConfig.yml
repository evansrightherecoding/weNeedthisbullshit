# Shared Mihomo DNS base for Clash Verge Rev / FlClash.
# Requires the generated Selected group to resolve to a working proxy.
# Configure TUN/VPN in each client's UI; no TUN settings are included here.
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # These compatibility exceptions receive real IPs, not fake IPs.
  # Filtering does not select a DNS upstream or force a DIRECT connection.
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    # Local names; private DNS records still need a local resolver or hosts.
    - '+.lan'
    - '+.local'
    - '+.localdomain'
    - '+.localhost'
    - '+.home.arpa'
    # Common router administration names.
    - '+.miwifi.com'
    - '+.router.asus.com'
    - '+.tplinkwifi.net'
    - '+.tendawifi.com'
    # Clock synchronization.
    - '+.pool.ntp.org'
    - 'time.apple.com'
    - 'time-ios.apple.com'
    - 'time.windows.com'
    - 'time.android.com'
    - 'time.google.com'
    - 'ntp.aliyun.com'
    # Network connectivity / captive portal checks, including Xiaomi.
    - 'captive.apple.com'
    - 'connectivitycheck.gstatic.com'
    - 'connectivitycheck.android.com'
    - 'connect.rom.miui.com'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    # Local login callbacks.
    - 'localhost.ptlogin2.qq.com'
    - 'localhost.sec.qq.com'
    - 'localhost.*.weixin.qq.com'
    # Common STUN names for calls and games; routing rules still apply.
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - '+.stun.*.*.*.*'
    - '+.stun.*.*.*.*.*'
    #LAN
    - '*.example'
    - '*.invalid'
    - '*.test'
    #放行NTP服务
    - 'time.*.com'
    - 'time.*.gov'
    - 'time.*.edu.cn'
    - 'time.*.apple.com'
    - 'time1.*.com'
    - 'time2.*.com'
