# Shared Mihomo DNS base for Clash Verge Rev / FlClash.
# Requires the generated Selected group to resolve to a working proxy.
# Configure TUN/VPN in each client's UI; no TUN settings are included here.
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: redir-host
  use-hosts: true
  use-system-hosts: true
  prefer-h3: false

  # Explicit #Selected / #DIRECT routes avoid dependence on traffic-rule order.
  respect-rules: false

  # Bootstrap only: resolve DNS server hostnames without needing a proxy.
  # IP-based HTTPS endpoints avoid plaintext bootstrap DNS.
  default-nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query

  # Resolve proxy node hostnames independently, avoiding proxy/DNS recursion.
  proxy-server-nameserver:
    - 'https://223.5.5.5/dns-query#DIRECT'
    - 'https://223.6.6.6/dns-query#DIRECT'

  # Default DNS queries use an encrypted proxy path, including initial
  # redir-host queries for domains that may later connect via DIRECT.
  # Selected is shared by all INI templates; Current/Final may select DIRECT.
  nameserver:
    - 'https://1.1.1.1/dns-query#Selected'
    - 'https://8.8.8.8/dns-query#Selected'

  # Domestic DNS for domain resolution performed by the DIRECT outbound.
  # This does not replace the initial redir-host DNS query.
  direct-nameserver:
    - 'https://223.5.5.5/dns-query#DIRECT'
    - 'https://223.6.6.6/dns-query#DIRECT'
  direct-nameserver-follow-policy: false

  # No domain-specific DNS policy yet; initial queries use nameserver above.
  nameserver-policy: {}
  fallback: []
